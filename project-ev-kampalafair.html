<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Kampala Fair Events — Events | Xpo Imaging Limited</title>
<link rel="icon" type="image/png" href="xpo logo/Profile XPO LOGO 2019.png">
<style>
*:not(code):not(pre){font-family:'Century Gothic',CenturyGothic,AppleGothic,sans-serif !important;}
:root{--bg:#fff;--ink:#0d1f2d;--ink-mid:#1e2d3a;--blue-deep:#0a3d5c;--sky:#1a8ab5;--rule:#cde3f0;--maxw:1400px;--brand-color:#e63946;}
*{box-sizing:border-box;}html{scroll-behavior:smooth;}body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;}
a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}h1,h2,h3{margin:0;font-weight:700;}.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
header.site{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:68px;background:rgba(255,255,255,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--rule);box-shadow:0 1px 16px rgba(13,63,92,0.07);}
.logo-img{height:44px;width:auto;display:block;}
.back-link{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;color:var(--ink-mid);display:flex;align-items:center;gap:8px;transition:color .2s;}.back-link:hover{color:var(--sky);}.back-link svg{width:16px;height:16px;}
.breadcrumb{background:var(--blue-deep);padding:14px 32px;margin-top:68px;display:flex;align-items:center;gap:16px;}
.breadcrumb a{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.6);font-weight:700;transition:color .2s;}.breadcrumb a:hover{color:#fff;}
.breadcrumb-sep{color:rgba(255,255,255,0.3);font-size:14px;}.breadcrumb-current{font-size:13px;color:rgba(255,255,255,0.85);font-weight:400;}
.project-header{padding:100px 0 50px;text-align:center;}
.project-header-label{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brand-color);display:block;margin-bottom:12px;}
.project-header h1{font-size:clamp(36px,5vw,64px);letter-spacing:-0.02em;line-height:1.05;}
.masonry{columns:3;column-gap:16px;padding:0 0 80px;}.masonry-item{break-inside:avoid;margin-bottom:16px;border-radius:10px;overflow:hidden;cursor:pointer;}.masonry-item img{width:100%;display:block;transition:transform .5s;}.masonry-item:hover img{transform:scale(1.03);}
.lb{position:fixed;inset:0;z-index:200;background:rgba(7,19,26,0.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s;}.lb.open{opacity:1;visibility:visible;}
.lb-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:4px;}
.lb-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;opacity:0.7;}.lb-close:hover{opacity:1;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .2s;}.lb-nav:hover{background:var(--sky);}.lb-prev{left:20px;}.lb-next{right:20px;}
.lb-counter{position:absolute;bottom:20px;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;}
.project-cta{text-align:center;padding:0 0 80px;}.project-cta a{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--brand-color);border:2px solid var(--brand-color);padding:14px 28px;border-radius:6px;transition:all .22s;}.project-cta a:hover{background:var(--brand-color);color:#fff;}.project-cta a svg{width:14px;height:14px;}
@media(max-width:900px){.masonry{columns:2;column-gap:12px;}}
@media(max-width:560px){.masonry{columns:1;}.wrap{padding:0 20px;}.project-header h1{font-size:clamp(28px,8vw,44px);}}
</style>
</head>
<body>
<header class="site">
  <a href="index.html" class="logo"><img src="xpo logo/Profile XPO LOGO 2019.png" alt="Xpo Imaging" class="logo-img"></a>
  <a href="events.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Back to Events</a>
</header>
<div class="breadcrumb">
  <a href="index.html#services">SERVICES</a><span class="breadcrumb-sep">&raquo;</span>
  <a href="events.html">EVENTS</a><span class="breadcrumb-sep">&raquo;</span>
  <span class="breadcrumb-current">Kampala Fair Events</span>
</div>
<div class="project-header">
  <span class="project-header-label">Events Production</span>
  <h1>Kampala Fair Events</h1>
</div>
<div class="wrap">
  <div class="masonry" id="masonry">
    <div class="masonry-item"><img src="services/photograpy.jpeg" alt="Kampala Fair event" loading="lazy"></div>
    <div class="masonry-item"><img src="services/video production.jpeg" alt="Kampala Fair stage" loading="lazy"></div>
    <div class="masonry-item"><img src="services/branding.jpeg" alt="Kampala Fair branding" loading="lazy"></div>
    <div class="masonry-item"><img src="services/communication and documentation.jpeg" alt="Kampala Fair coverage" loading="lazy"></div>
    <div class="masonry-item"><img src="services/social media management.jpeg" alt="Kampala Fair social" loading="lazy"></div>
  </div>
  <div class="project-cta"><a href="mailto:xpoimaging@gmail.com?subject=Events%20Production%20Inquiry">Start Your Project <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></a></div>
</div>
<div class="lb" id="lb"><button class="lb-close" id="lbClose">&times;</button><button class="lb-nav lb-prev" id="lbPrev">&#8592;</button><img class="lb-img" id="lbImg" src="" alt=""><button class="lb-nav lb-next" id="lbNext">&#8594;</button><span class="lb-counter" id="lbCounter"></span></div>
<script>
(function(){const items=Array.from(document.querySelectorAll('.masonry-item')),lb=document.getElementById('lb'),img=document.getElementById('lbImg'),ctr=document.getElementById('lbCounter');let idx=0;items.forEach((item,i)=>{item.addEventListener('click',()=>{idx=i;show();lb.classList.add('open');document.body.style.overflow='hidden';});});function show(){img.src=items[idx].querySelector('img').src;ctr.textContent=(idx+1)+' / '+items.length;}function close(){lb.classList.remove('open');document.body.style.overflow='';}document.getElementById('lbClose').onclick=close;lb.addEventListener('click',e=>{if(e.target===lb)close();});document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();idx=(idx-1+items.length)%items.length;show();};document.getElementById('lbNext').onclick=e=>{e.stopPropagation();idx=(idx+1)%items.length;show();};document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'){idx=(idx-1+items.length)%items.length;show();}if(e.key==='ArrowRight'){idx=(idx+1)%items.length;show();}});})();
</script>
</body>
</html>
