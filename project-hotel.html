<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>7 STAR | Xpo Imaging Limited</title>
<link rel="icon" type="image/png" href="xpo logo/Profile XPO LOGO 2019.png">
<style>
/* Custom Cursor */
.cursor{position:fixed;width:12px;height:12px;background:#fff;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s ease,height .2s ease,background .2s ease,opacity .2s ease;mix-blend-mode:difference;opacity:0;}
.cursor.active{opacity:1;}
.cursor.hover{width:48px;height:48px;background:rgba(37,99,235,0.3);border:1px solid rgba(255,255,255,0.4);}
@media(max-width:900px){.cursor{display:none;}}
/* Page transition */
.page-transition{position:fixed;inset:0;z-index:10000;background:#0F1419;transform:scaleY(0);transform-origin:bottom;pointer-events:none;}
.page-transition.active{animation:pageOut .5s cubic-bezier(.77,0,.175,1) forwards;}
@keyframes pageOut{0%{transform:scaleY(0);transform-origin:bottom;}50%{transform:scaleY(1);transform-origin:bottom;}51%{transform-origin:top;}100%{transform:scaleY(0);transform-origin:top;}}
body{animation:bodyFadeIn .6s ease forwards;}
@keyframes bodyFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
*:not(code):not(pre){font-family:'Century Gothic',CenturyGothic,AppleGothic,sans-serif !important;}
:root{--bg:#fff;--ink:#0d1f2d;--ink-mid:#1e2d3a;--blue-deep:#0a3d5c;--sky:#1a8ab5;--rule:#cde3f0;--maxw:1600px;--brand-color:#f5c518;}
*{box-sizing:border-box;}html{scroll-behavior:smooth;}body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;}
a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}h1,h2,h3{margin:0;font-weight:700;}
.project-hero{position:relative;height:50vh;min-height:320px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.project-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.project-hero-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.4);}
.project-hero-title{position:relative;z-index:2;font-size:clamp(32px,6vw,64px);color:#fff;text-align:center;letter-spacing:0.06em;text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,0.4);}
.project-logo-bar{display:flex;align-items:center;justify-content:center;padding:24px 0;border-bottom:1px solid var(--rule);}
.project-logo-bar img{height:48px;width:auto;}
.project-info-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;max-width:var(--maxw);margin:0 auto;}
.project-info-label{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;color:var(--ink-mid);}
.project-info-back a{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;color:var(--ink-mid);display:flex;align-items:center;gap:6px;transition:color .2s;}
.project-info-back a:hover{color:var(--brand-color);}
.project-info-back svg{width:14px;height:14px;}
.dense-masonry{columns:4;column-gap:6px;padding:8px 6px 60px;}
.dense-masonry-item{break-inside:avoid;margin-bottom:6px;overflow:hidden;cursor:pointer;}
.dense-masonry-item img{width:100%;display:block;transition:transform .4s ease;}
.dense-masonry-item:hover img{transform:scale(1.03);}
.lb{position:fixed;inset:0;z-index:200;background:rgba(7,19,26,0.96);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s;}.lb.open{opacity:1;visibility:visible;}
.lb-img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:2px;}
.lb-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;opacity:0.7;}.lb-close:hover{opacity:1;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.08);border:none;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s;}.lb-nav:hover{background:var(--brand-color);}.lb-prev{left:16px;}.lb-next{right:16px;}
.lb-counter{position:absolute;bottom:16px;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;}
.project-cta{text-align:center;padding:20px 0 60px;}
.project-cta a{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--ink);border:2px solid var(--ink);padding:14px 32px;border-radius:4px;transition:all .22s;}
.project-cta a:hover{background:var(--ink);color:#fff;}
.project-footer{text-align:center;padding:20px 0 32px;font-size:11px;color:var(--ink-mid);letter-spacing:0.06em;}
@media(max-width:900px){.dense-masonry{columns:3;column-gap:4px;}.dense-masonry-item{margin-bottom:4px;}.project-hero{height:40vh;}}
@media(max-width:560px){.dense-masonry{columns:2;column-gap:3px;}.dense-masonry-item{margin-bottom:3px;}.project-hero{height:35vh;min-height:240px;}.project-hero-title{font-size:clamp(24px,8vw,40px);}.project-info-bar{padding:12px 16px;}}
</style>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="page-transition" id="pageTransition"></div>
<div class="project-hero" data-aos="fade-up">
  <img src="services/printing and designing.PNG" alt="7 STAR">
  <div class="project-hero-overlay"></div>
  <h1 class="project-hero-title">7 STAR</h1>
</div>
<div class="project-logo-bar"><img src="xpo logo/Profile XPO LOGO 2019.png" alt="Xpo Imaging"></div>
<div class="project-info-bar">
  <span class="project-info-label">Branding &amp; Marketing</span>
  <div class="project-info-back"><a href="branding.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Back to Branding</a></div>
</div>
<div class="dense-masonry" id="masonry">
  <div class="dense-masonry-item"><img src="services/branding.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/photograpy.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/graphics deign.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/social media management.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/video production.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/communication and documentation.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/printing and designing.PNG" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/branding.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/photograpy.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/graphics deign.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/social media management.jpeg" alt="Project" loading="lazy"></div>
  <div class="dense-masonry-item"><img src="services/video production.jpeg" alt="Project" loading="lazy"></div>
</div>
<div class="project-cta"><a href="https://wa.me/256704446399?text=Hello%20XPO%20Imaging%2C%20I%27d%20like%20to%20start%20a%20project">Get in touch</a></div>
<div class="project-footer">Powered by <strong>XPO IMAGING</strong></div>
<div class="lb" id="lb"><button class="lb-close" id="lbClose">&times;</button><button class="lb-nav lb-prev" id="lbPrev">&#8592;</button><img class="lb-img" id="lbImg" src="" alt=""><button class="lb-nav lb-next" id="lbNext">&#8594;</button><span class="lb-counter" id="lbCounter"></span></div>
<script>
(function(){const items=Array.from(document.querySelectorAll('.dense-masonry-item')),lb=document.getElementById('lb'),img=document.getElementById('lbImg'),ctr=document.getElementById('lbCounter');let idx=0;items.forEach((item,i)=>{item.addEventListener('click',()=>{idx=i;show();lb.classList.add('open');document.body.style.overflow='hidden';});});function show(){img.src=items[idx].querySelector('img').src;ctr.textContent=(idx+1)+' / '+items.length;}function close(){lb.classList.remove('open');document.body.style.overflow='';}document.getElementById('lbClose').onclick=close;lb.addEventListener('click',e=>{if(e.target===lb)close();});document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();idx=(idx-1+items.length)%items.length;show();};document.getElementById('lbNext').onclick=e=>{e.stopPropagation();idx=(idx+1)%items.length;show();};document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft'){idx=(idx-1+items.length)%items.length;show();}if(e.key==='ArrowRight'){idx=(idx+1)%items.length;show();}});})();
</script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({duration:800,easing:'ease-out-cubic',once:true,offset:80});
(function(){const cursor=document.getElementById('cursor');if(!cursor||window.innerWidth<900)return;let mx=0,my=0,cx=0,cy=0;document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.classList.add('active');});document.addEventListener('mouseleave',()=>cursor.classList.remove('active'));function anim(){cx+=(mx-cx)*.15;cy+=(my-cy)*.15;cursor.style.left=cx+'px';cursor.style.top=cy+'px';requestAnimationFrame(anim);}anim();document.querySelectorAll('a,button,.project-card,.service-item,.testi-slide,.masonry-item,.dense-masonry-item').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hover'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));});})();
(function(){const t=document.getElementById('pageTransition');document.querySelectorAll('a[href]').forEach(l=>{if(l.hostname!==window.location.hostname)return;if(l.getAttribute('href').startsWith('#'))return;if(l.getAttribute('href').startsWith('mailto'))return;if(l.getAttribute('onclick'))return;l.addEventListener('click',e=>{e.preventDefault();const h=l.getAttribute('href');t.classList.add('active');setTimeout(()=>{window.location.href=h;},500);});});})();
</script>
</body>
</html>
